name: Build Windows Exe

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 v2.0）'
        required: true
        default: 'v2.0'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Teacher exe
        run: |
          pyinstaller --onefile --name "MythwareTeacher" `
            --add-data "templates;templates" `
            --add-data "static;static" `
            --hidden-import flask `
            app.py
        shell: pwsh

      - name: Build Student Agent exe
        run: |
          pyinstaller --onefile --name "MythwareStudentAgent" `
            --hidden-import PIL `
            --hidden-import requests `
            student_agent.py
        shell: pwsh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Windows-exe
          path: |
            dist/MythwareTeacher.exe
            dist/MythwareStudentAgent.exe
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/MythwareTeacher.exe
            dist/MythwareStudentAgent.exe
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
